[package]
name = "turso-go"
edition = "2024"
authors = ["The Turso Authors"]
license = "MIT"

[lib]
name = "turso_go"
crate-type = ["cdylib"]
path = "rs_src/lib.rs"

[dependencies]
env_logger = { version = "0.11.6", default-features = false }
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = {version =  "0.3.20", features = ["env-filter"] }
turso_core = { version = "0.2.0-pre.14" }
